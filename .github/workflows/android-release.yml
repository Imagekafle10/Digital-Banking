name: Android Release

on:
  workflow_dispatch: # releases ONLY when you click "Run workflow" on the Actions tab
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options:
          - patch # 1.0.2 -> 1.0.3  (bug fixes, small updates)
          - minor # 1.0.2 -> 1.1.0  (new features)
          - major # 1.0.2 -> 2.0.0  (big changes)
        default: patch

permissions:
  contents: write

concurrency:
  group: android-release # two quick runs never pick the same version
  cancel-in-progress: false

jobs:
  check:
    name: Work out next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick next version
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # newest existing release tag (vX.Y.Z); falls back to pubspec version if there is none
          LATEST=$(git ls-remote --tags --refs origin 'v*' \
                   | sed 's#.*refs/tags/v##' \
                   | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION=$(grep '^version:' frontend/pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//' | tr -d '\r ')
          else
            IFS=. read -r MA MI PA <<< "$LATEST"
            case "$BUMP" in
              major) VERSION="$((MA + 1)).0.0" ;;
              minor) VERSION="${MA}.$((MI + 1)).0" ;;
              *)     VERSION="${MA}.${MI}.$((PA + 1))" ;;
            esac
          fi
          echo "Latest: ${LATEST:-none}  ->  Next: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Set up release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::No signing secrets - building with the debug key. Add the ANDROID_* secrets later for a permanent release key."
            exit 0
          fi
          echo "$KS_B64" | base64 --decode > "${{ github.workspace }}/frontend/android/release.jks"
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=${{ github.workspace }}/frontend/android/release.jks"
          } > android/key.properties

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ needs.check.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/image-bank-v${{ needs.check.outputs.version }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Image Bank v${{ needs.check.outputs.version }}
          generate_release_notes: true
          body: |
            ## Installation
            Download `image-bank-v${{ needs.check.outputs.version }}.apk`, install it on an Android device, and allow installation from unknown sources if asked.
          files: frontend/build/app/outputs/flutter-apk/image-bank-v${{ needs.check.outputs.version }}.apk
